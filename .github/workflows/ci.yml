name: CI

# Continuous integration for pull requests and non-main pushes.
# Runs lint, typecheck, build, and tests. Does NOT deploy — the deploy.yml
# workflow handles build + deploy on push to main.
#
# Azure Container Apps is the active deployment target. Netlify/Vercel
# deployment has been discontinued (see git history for the removed jobs).

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore:
      - main
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck & Build
        run: npm run build:check

      - name: Run tests
        run: npm run test:run

      - name: Migration smoke-test (optional)
        # Only runs if Supabase credentials are available (set on the repo
        # for PRs from the same repo; skipped for forked PRs).
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: npm run smoke-test:migration
