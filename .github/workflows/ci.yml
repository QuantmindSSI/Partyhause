name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore:
      - main
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # @prisma/client ships as a stub whose types are written by `generate`.
      # Without this step the package exports nothing, and typechecking
      # tsconfig.server.json fails with TS2305 "has no exported member
      # 'PrismaClient'" plus knock-on TS2322 errors where inferred query
      # results collapse to `unknown`. There is no postinstall hook, so
      # `npm ci` alone does not produce it. It passes locally only because a
      # previous manual `prisma generate` left the client in node_modules.
      # No database connection is required to generate from the schema.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck & Build
        run: npm run build:check

      - name: Run tests
        run: npm run test:run
