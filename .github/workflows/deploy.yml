name: 🚀 Deploy to Netlify (CI Only)

# DISABLED: Vercel deployment discontinued
# Netlify auto-deploys on push via webhook (no workflow needed)
# This workflow now only runs CI checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  # Build and Test Job
  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📥 Install dependencies
        run: npm ci
        
      - name: 🔍 Lint code
        run: npm run lint
        
      - name: 🧪 Run tests
        run: npm run test:run
        
      - name: 🏗️ Build application
        run: npm run build
        env:
          CI: true
          NODE_ENV: production
          # Use placeholder values for build (actual values set in Vercel)
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder-key"
          VITE_APP_ENV: "production"

