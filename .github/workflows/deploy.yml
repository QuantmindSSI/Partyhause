name: 🚀 Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-partyhause-dev2
  ACR_NAME: acrpartyhausel2apcqjqxo6qu
  ACR_LOGIN_SERVER: acrpartyhausel2apcqjqxo6qu.azurecr.io
  WEB_APP_NAME: ca-web-partyhause-l2apcqjqxo6qu
  API_APP_NAME: ca-api-partyhause-l2apcqjqxo6qu
  NODE_VERSION: '20'

jobs:
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔍 Lint code
        run: npm run lint
        continue-on-error: true

      - name: 🧪 Run tests
        run: npm run test:run
        continue-on-error: true

  deploy:
    name: 🚀 Deploy to Azure
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🔐 Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🏗️ Build & Push Web Image to ACR
        uses: azure/acr-build@v1
        with:
          registry-name: ${{ env.ACR_NAME }}
          image: partyhause-web
          tag: latest
          dockerfile: Dockerfile
          folder: .

      - name: 🏗️ Build & Push API Image to ACR
        uses: azure/acr-build@v1
        with:
          registry-name: ${{ env.ACR_NAME }}
          image: partyhause-api
          tag: latest
          dockerfile: Dockerfile.api
          folder: .

      - name: 🚀 Update Web Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          container-app-name: ${{ env.WEB_APP_NAME }}
          image: ${{ env.ACR_LOGIN_SERVER }}/partyhause-web:latest

      - name: 🚀 Update API Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          container-app-name: ${{ env.API_APP_NAME }}
          image: ${{ env.ACR_LOGIN_SERVER }}/partyhause-api:latest

      - name: ✅ Deployment Summary
        run: |
          echo "## Deployment Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- **Web PWA**: https://${{ env.WEB_APP_NAME }}.delightfulground-7d0dbf37.eastus2.azurecontainerapps.io/" >> $GITHUB_STEP_SUMMARY
          echo "- **API Server**: https://${{ env.API_APP_NAME }}.delightfulground-7d0dbf37.eastus2.azurecontainerapps.io/" >> $GITHUB_STEP_SUMMARY