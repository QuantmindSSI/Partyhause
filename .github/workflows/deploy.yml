name: 🚀 Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  # Build and Test Job
  build:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4
        
      - name: 🏗️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📥 Install dependencies
        run: npm ci
        
      - name: 🔍 Lint code
        run: npm run lint
        
      - name: 🧪 Run tests
        run: npm run test:run
        
      - name: 🏗️ Build application
        run: npm run build
        env:
          CI: true
          NODE_ENV: production
          # Use placeholder values for build (actual values set in Vercel)
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder-key"
          VITE_APP_ENV: "production"

  # Deploy Job (only when secrets are available)
  deploy:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    
    steps:
      - name: 📂 Checkout repository
        uses: actions/checkout@v4
        
      - name: ⚙️ Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 🚀 Deploy to Vercel
        run: |
          VERCEL_TOKEN='${{ secrets.VERCEL_TOKEN }}'
          VERCEL_ORG_ID='${{ secrets.VERCEL_ORG_ID }}'
          VERCEL_PROJECT_ID='${{ secrets.VERCEL_PROJECT_ID }}'
          VITE_SUPABASE_URL='${{ secrets.VITE_SUPABASE_URL }}'
          VITE_SUPABASE_ANON_KEY='${{ secrets.VITE_SUPABASE_ANON_KEY }}'

          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_ORG_ID}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "⚠️ Missing Vercel secrets; skipping deploy job."
            echo "Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in repository secrets to enable deployment."
            exit 0
          fi

          echo "✅ Vercel secrets detected. Proceeding with deploy."
          vercel deploy --prod --confirm --token "${VERCEL_TOKEN}" --scope "${VERCEL_ORG_ID}"
          VITE_APP_ENV: "production"
          
      - name: ✅ Deployment Status
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployment successful!"
            echo "🌐 Your app is live on Vercel!"
          else
            echo "⚠️ Deployment attempted but may need Vercel secrets to be configured"
            echo "📖 See DEPLOYMENT.md for setup instructions"
          fi