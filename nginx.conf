# nginx configuration for the PartyHause web container.
#
# Replaces the six-line config the Dockerfile generated with `RUN echo`, which
# set no Cache-Control header on any response. With neither Cache-Control nor
# Expires, a browser falls back to heuristic freshness (RFC 9111 s4.2.2) and
# decides for itself how long to reuse a response.
#
# That is how a corrected build failed to reach every user. vite-plugin-pwa
# precaches index.html and installs a navigation route bound to it
# (createHandlerBoundToURL), so every navigation is answered from the service
# worker's precache rather than the network. A client that installed the worker
# while a broken build was live keeps serving that build until it refetches
# /sw.js and the new worker takes over. Chrome bypasses the HTTP cache for
# service worker scripts; Safari honours heuristic freshness. So Chrome picked
# up the fix and Safari kept replaying the broken bundle from precache.
#
# Policy, by URL shape:
#   fingerprinted   immutable for a year, never revalidated
#   unversioned     no-cache, meaning store but revalidate before reuse
#   static media    one hour, bounded because the names are stable
#
# Every location that serves a real file ends in `try_files $uri =404`. The
# previous config sent unmatched paths to the SPA fallback, so a missing PNG
# was answered with index.html and HTTP 200: the browser received HTML where it
# expected an image and nothing ever reported an error.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  # The eager vendor chunk alone is 390 KB uncompressed. text/html is always
  # compressed when gzip is on and must not be named in gzip_types.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  # Both JavaScript media types are listed because nginx's bundled mime.types
  # has mapped .js to application/javascript and to text/javascript in
  # different releases, and the base image floats on nginx:alpine.
  gzip_types
    text/css
    text/plain
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # ---------------------------------------------------------------- immutable

  # Vite fingerprints everything it emits under /assets, so a change to the
  # bytes changes the URL and the response never needs revalidating.
  #
  # `^~` stops nginx evaluating the regex locations further down. Without it,
  # the static-media regex would win for an SVG or WOFF that Vite emitted into
  # /assets and demote a fingerprinted file to the one-hour policy.
  #
  # `always` is deliberately absent here. It would extend the header to error
  # responses, and a 404 carrying `immutable, max-age=31536000` would be cached
  # for a year.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Workbox runtime, fingerprinted by vite-plugin-pwa as workbox-<hash>.js and
  # loaded by sw.js through importScripts.
  location ~ ^/workbox-[0-9a-f]+\.js$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # --------------------------------------------------------------- revalidate

  # `no-cache` does not mean "do not store". It means "store, but revalidate
  # before reuse", which is exactly right for unversioned URLs whose contents
  # change on every deploy. ETag turns the check into a 304 in the common case.
  #
  # /sw.js is the file that unsticks a stale client. The worker decides what
  # every navigation receives, so if a browser will not refetch this one file,
  # nothing else in this config can reach that user.
  #
  # `always` extends the header past nginx's default set of 200, 204, 301, 302
  # and 304, so a 404 here is not heuristically cached either.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Standalone legal and support pages, served from public/ and unfingerprinted.
  # App Store review resolves the privacy URL directly, so it has to return the
  # current document rather than a cached copy.
  location ~ ^/(privacy|terms|support)\.html$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /robots.txt {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # ------------------------------------------------------------ static media

  # Icons, brand marks, posters and video keep stable names across deploys, so
  # they cannot be immutable. One hour bounds how long a replaced file can be
  # served while still avoiding a request per navigation.
  location ~* \.(png|jpe?g|gif|svg|ico|webp|avif|woff2?|mp4|webm)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # -------------------------------------------------- unfingerprinted code

  # Script, style and data files that Vite did not fingerprint into /assets.
  # The exact-match and prefix locations above already claim the ones this build
  # emits by name (/sw.js, /registerSW.js, /manifest.webmanifest, /robots.txt,
  # /workbox-<hash>.js, everything under /assets/ and /.well-known/), and both
  # take priority over this regex, so nothing here is demoted to no-cache.
  #
  # This block exists for the ones that are absent. These extensions matched no
  # location, fell through to the SPA fallback and were answered with index.html
  # and HTTP 200, which is the failure the =404 rules elsewhere in this file were
  # written to stop. The comment above the fallback claimed "file-shaped paths
  # are handled above"; for .js and .css that was not true. Measured against
  # production on 2026-09-07, before this rule existed:
  #
  #   GET /definitely-not-a-real-asset.js -> 200 text/html
  #
  # A <script src> pointed at a missing bundle then fails with "Unexpected token
  # '<'" while the network tab shows a success, which sends the reader looking
  # for a syntax error in code that was never served. 404 names the real fault.
  #
  # no-cache rather than the one-hour media policy: these names are stable across
  # deploys but their contents are not, which is the same reason /sw.js and
  # index.html revalidate.
  location ~* \.(js|mjs|cjs|css|json|map|txt|xml|webmanifest)$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # ------------------------------------------------------------- .well-known

  # Association files for iOS Universal Links and Android App Links.
  #
  # These have no file extension, so they matched none of the rules above and
  # fell through to the SPA fallback, which answered with index.html and
  # HTTP 200. Measured against production: /.well-known/apple-app-site-association
  # returned `200 text/html`. Apple requires application/json over HTTPS with no
  # redirect, so association would have failed while looking like it worked.
  #
  # `^~` takes this whole prefix out of regex matching. `=404` matters more here
  # than anywhere else in this file: a 404 correctly means "this domain claims no
  # app association", which is the truth today. An HTML 200 is a lie that Apple's
  # CDN would cache.
  #
  # no-cache because Apple and Google re-fetch these when an app updates its
  # entitlements, and a stale copy silently breaks deep links.
  location ^~ /.well-known/ {
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # ----------------------------------------------------------- SPA fallback

  # Everything remaining is a client-side route (/join/:token, /profile/:id and
  # the rest) and must receive the shell. File-shaped paths are handled above
  # and end in =404, so this no longer disguises a missing file as a 200.
  #
  # The fallback issues an internal redirect to /index.html, which re-enters
  # location matching and picks up the no-cache header defined for it above.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
