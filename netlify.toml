# Netlify configuration for PartyHause Web PWA
[build]
  # Build from root directory
  base = "."
  # Ignore monorepo subdirectories
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF apps/ packages/"
  # Use the web PWA build script
  command = "npm run build:web"
  # Output directory from Vite build
  publish = "dist"
  functions = "netlify/functions"

# Build settings
[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "8"

# Headers for PWA and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

