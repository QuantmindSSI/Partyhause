# Netlify configuration for PartyHause Web PWA
[build]
  # Build from root directory
  base = "."
  # Use the web PWA build script
  command = "npm run build:web"
  # Output directory from Vite build
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Redirects for PWA/SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
