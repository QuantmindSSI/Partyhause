<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  
  <!-- PWA Primary Meta Tags -->
  <title>PartyHause - Create Unforgettable Events</title>
  <meta name="title" content="PartyHause - Create Unforgettable Events" />
  <meta name="description" content="Create unforgettable events with friends. Manage guest lists, send invitations, track RSVPs, and create lasting memories." />
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#6366F1" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#4F46E5" />
  
  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="/icon.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="shortcut icon" href="/favicon.png" />
  
  <!-- iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PartyHause" />
  
  <!-- Android Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  
  <!-- Microsoft Meta Tags -->
  <meta name="msapplication-TileColor" content="#6366F1" />
  <meta name="msapplication-tap-highlight" content="no" />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://partyhause.vercel.app/" />
  <meta property="og:title" content="PartyHause - Create Unforgettable Events" />
  <meta property="og:description" content="Create unforgettable events with friends. Manage guest lists, send invitations, track RSVPs, and create lasting memories." />
  <meta property="og:image" content="/icon-512.png" />
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://partyhause.vercel.app/" />
  <meta property="twitter:title" content="PartyHause - Create Unforgettable Events" />
  <meta property="twitter:description" content="Create unforgettable events with friends. Manage guest lists, send invitations, track RSVPs, and create lasting memories." />
  <meta property="twitter:image" content="/icon-512.png" />
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #FFFFFF;
    }
    
    #root {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    
    /* Loading screen */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    .loading-logo {
      width: 120px;
      height: 120px;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .loading-text {
      color: white;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .loading-spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.9; }
    }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  
  <!-- Loading Screen -->
  <div class="loading-screen" id="loading-screen">
    <img src="/icon.png" alt="PartyHause" class="loading-logo" />
    <div class="loading-text">PartyHause</div>
    <div class="loading-spinner"></div>
  </div>
  
  <!-- App Root -->
  <div id="root"></div>
  
  <script>
    // Hide loading screen when app loads
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          loadingScreen.style.transition = 'opacity 0.3s ease-out';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 300);
        }
      }, 500);
    });
  </script>
</body>
</html>
